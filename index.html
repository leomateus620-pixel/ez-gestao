<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZ Gestao</title>
    <meta name="description" content="Automacao segura de guias e rotinas fiscais" />
    <meta name="author" content="EZ Gestao" />

    <meta property="og:title" content="EZ Gestao" />
    <meta property="og:description" content="Automacao segura de guias e rotinas fiscais" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <style>
      #app-boot-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f8fafc;
      }

      #app-boot-fallback .boot-box {
        max-width: 360px;
        text-align: center;
      }

      #app-boot-fallback .boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border: 2px solid rgba(37, 99, 235, 0.24);
        border-top-color: #2563eb;
        border-radius: 999px;
        animation: ez-boot-spin 0.9s linear infinite;
      }

      #app-boot-fallback .boot-loading {
        margin: 0 0 22px;
        font-size: 13px;
        color: #334155;
      }

      #app-boot-fallback .boot-title {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
      }

      #app-boot-fallback .boot-message {
        margin: 0 0 16px;
        font-size: 13px;
        line-height: 1.55;
        color: #475569;
      }

      #app-boot-fallback .boot-button {
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 18px;
      }

      @keyframes ez-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        window.__EZ_APP_BOOTED__ = false;
        var recoveryKey = 'ez-app-asset-recovery-at';
        var recoveryWindowMs = 30000;

        function showBootError(title, message) {
          var titleNode = document.getElementById('app-boot-title');
          var messageNode = document.getElementById('app-boot-message');
          if (titleNode) {
            titleNode.hidden = false;
            titleNode.textContent = title;
          }
          if (messageNode) {
            messageNode.textContent = message;
          }
        }

        function canRecover() {
          try {
            var lastRecovery = Number(sessionStorage.getItem(recoveryKey) || 0);
            if (lastRecovery && Date.now() - lastRecovery < recoveryWindowMs) return false;
            sessionStorage.setItem(recoveryKey, String(Date.now()));
            return true;
          } catch (err) {
            return true;
          }
        }

        function clearCaches() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys()
            .then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            })
            .catch(function () {});
        }

        window.__EZ_RELOAD_APP__ = function () {
          showBootError('Atualizando arquivos do app...', 'Limpando cache local e buscando a versao mais recente.');
          clearCaches().finally(function () {
            window.location.reload();
          });
        };

        window.addEventListener('error', function (event) {
          var target = event.target;
          var tagName = target && target.tagName;
          var assetUrl = target && (target.src || target.href);
          var isAssetError = (tagName === 'SCRIPT' || tagName === 'LINK') && assetUrl && assetUrl.indexOf('/assets/') !== -1;
          if (!isAssetError) return;

          if (canRecover()) {
            window.__EZ_RELOAD_APP__();
            return;
          }

          showBootError(
            'Nao foi possivel carregar o aplicativo',
            'Os arquivos do app nao foram carregados. Verifique sua conexao e tente novamente.'
          );
        }, true);

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (window.__EZ_APP_BOOTED__) return;
            showBootError(
              'Nao foi possivel iniciar o aplicativo',
              'O carregamento demorou mais que o esperado. Recarregue para buscar os arquivos mais recentes.'
            );
          }, 12000);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="app-boot-fallback" role="status" aria-live="polite">
        <div class="boot-box">
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-loading">Carregando aplicacao...</p>
          <p id="app-boot-title" class="boot-title" hidden>Nao foi possivel carregar o aplicativo</p>
          <p id="app-boot-message" class="boot-message">Preparando o acesso ao sistema.</p>
          <button class="boot-button" type="button" onclick="window.__EZ_RELOAD_APP__ ? window.__EZ_RELOAD_APP__() : window.location.reload()">Recarregar</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
