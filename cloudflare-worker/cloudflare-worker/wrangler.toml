name = "gestaoez"
main = "src/index.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering binding (already exists in this account)
browser = { binding = "gestaoez" }

[vars]
VERSION = "1.0.0"
# CALLBACK_BASE is set per environment (Supabase Functions URL)
# Example: https://wsgphutkybxhajyicxif.supabase.co/functions/v1

# Secrets to set via `wrangler secret put`:
#   LOVABLE_HMAC_SECRET     -> matches CLOUDFLARE_WORKER_HMAC_SECRET in Supabase
#   CALLBACK_HMAC_SECRET    -> matches CF_CALLBACK_HMAC_SECRET in Supabase
#   CALLBACK_BASE_URL       -> https://wsgphutkybxhajyicxif.supabase.co/functions/v1